name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download ffmpeg
        run: |
          curl -L "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          Get-ChildItem -Recurse -Filter "ffmpeg.exe"  ffmpeg_extracted | Select-Object -First 1 | Copy-Item -Destination "."
          Get-ChildItem -Recurse -Filter "ffprobe.exe" ffmpeg_extracted | Select-Object -First 1 | Copy-Item -Destination "."
          Remove-Item -Recurse -Force ffmpeg_extracted
          Remove-Item -Force ffmpeg.zip

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "VideoDownloader" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-data "logo.ico;." `
            --add-data "logo.png;." `
            --icon "logo.ico" `
            downloader.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows
          path: dist/VideoDownloader.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "latest"
          name: "Latest Build"
          files: dist/VideoDownloader.exe
          body: "Single .exe"
          token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          sudo apt-get install -y ffmpeg

      - name: Build Linux binary
        run: |
          pyinstaller --onefile --windowed --name "VideoDownloader" \
            --add-data "logo.ico:." \
            --add-data "logo.png:." \
            downloader.py

      - name: Create .deb package
        run: |
          mkdir -p deb_pkg/usr/local/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/DEBIAN

          cp dist/VideoDownloader deb_pkg/usr/local/bin/
          chmod +x deb_pkg/usr/local/bin/VideoDownloader

          cat > deb_pkg/usr/share/applications/streamget.desktop << 'EOF'
          [Desktop Entry]
          Name=StreamGet
          Comment=Video Downloader
          Exec=/usr/local/bin/VideoDownloader
          Icon=/usr/local/bin/logo.png
          Terminal=false
          Type=Application
          Categories=Network;
          EOF

          cat > deb_pkg/DEBIAN/control << 'EOF'
          Package: streamget
          Version: 2.0
          Architecture: amd64
          Maintainer: Md. Imran Ali <imran.28279@gmail.com>
          Description: StreamGet Video Downloader
          EOF

          dpkg-deb --build deb_pkg StreamGet_Linux.deb

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamGet-Linux
          path: StreamGet_Linux.deb

      - name: Add .deb to Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "latest"
          name: "Latest Build"
          files: StreamGet_Linux.deb
          token: ${{ secrets.GITHUB_TOKEN }}
