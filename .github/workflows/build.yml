name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download ffmpeg (only extract ffmpeg.exe and ffprobe.exe)
        run: |
          curl -L "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          Get-ChildItem -Recurse -Filter "ffmpeg.exe"  ffmpeg_extracted | Select-Object -First 1 | Copy-Item -Destination "."
          Get-ChildItem -Recurse -Filter "ffprobe.exe" ffmpeg_extracted | Select-Object -First 1 | Copy-Item -Destination "."
          Remove-Item -Recurse -Force ffmpeg_extracted
          Remove-Item -Force ffmpeg.zip

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "VideoDownloader" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --icon "logo.ico" `
            downloader.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows
          path: dist/VideoDownloader.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "latest"
          name: "Latest Build"
          files: dist/VideoDownloader.exe
          body: "Single .exe"
          token: ${{ secrets.GITHUB_TOKEN }}
