name: Build Windows EXE & Linux DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  #  WINDOWS — EXE + NSIS Installer (Start Menu & Desktop shortcut)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "VideoDownloader" `
            --add-data "logo.ico;." `
            --add-data "logo.png;." `
            --icon "logo.ico" `
            downloader.py

      - name: Install NSIS
        run: choco install nsis -y

      - name: Create NSIS installer script
        run: |
          @"
          !include "MUI2.nsh"
          !include "LogicLib.nsh"

          Name "StreamGet"
          OutFile "StreamGet_Setup.exe"
          InstallDir "`$PROGRAMFILES\StreamGet"
          InstallDirRegKey HKCU "Software\StreamGet" ""
          RequestExecutionLevel admin
          Unicode True

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"

          Section "StreamGet" SecMain
            SetOutPath "`$INSTDIR"
            File "dist\VideoDownloader.exe"
            File "logo.ico"

            ; Start Menu shortcut
            CreateDirectory "`$SMPROGRAMS\StreamGet"
            CreateShortcut "`$SMPROGRAMS\StreamGet\StreamGet.lnk" "`$INSTDIR\VideoDownloader.exe" "" "`$INSTDIR\logo.ico"
            CreateShortcut "`$SMPROGRAMS\StreamGet\Uninstall.lnk" "`$INSTDIR\Uninstall.exe"

            ; Desktop shortcut
            CreateShortcut "`$DESKTOP\StreamGet.lnk" "`$INSTDIR\VideoDownloader.exe" "" "`$INSTDIR\logo.ico"

            ; Registry for uninstaller (Add/Remove Programs)
            WriteRegStr HKCU "Software\StreamGet" "" "`$INSTDIR"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StreamGet" "DisplayName" "StreamGet Video Downloader"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StreamGet" "UninstallString" "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StreamGet" "DisplayIcon" "`$INSTDIR\logo.ico"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StreamGet" "Publisher" "Md. Imran Ali"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StreamGet" "DisplayVersion" "2.0"

            ; FFmpeg check & auto-install
            nsExec::ExecToStack 'cmd /c ffmpeg -version'
            Pop $0
            ${If} $0 != "0"
              MessageBox MB_YESNO "FFmpeg found না। winget দিয়ে auto-install করবে?" IDYES inst_ffmpeg IDNO skip_ffmpeg
              inst_ffmpeg:
                nsExec::Exec 'winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements'
              skip_ffmpeg:
            ${EndIf}
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "`$INSTDIR\VideoDownloader.exe"
            Delete "`$INSTDIR\logo.ico"
            Delete "`$INSTDIR\Uninstall.exe"
            RMDir  "`$INSTDIR"

            Delete "`$SMPROGRAMS\StreamGet\StreamGet.lnk"
            Delete "`$SMPROGRAMS\StreamGet\Uninstall.lnk"
            RMDir  "`$SMPROGRAMS\StreamGet"

            Delete "`$DESKTOP\StreamGet.lnk"

            DeleteRegKey HKCU "Software\StreamGet"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StreamGet"
          SectionEnd
          "@ | Out-File -Encoding ASCII installer.nsi

      - name: Build NSIS installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload portable EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows-Portable
          path: dist/VideoDownloader.exe

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamGet-Windows-Setup
          path: StreamGet_Setup.exe

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "latest"
          name: "Latest Build"
          files: |
            dist/VideoDownloader.exe
            StreamGet_Setup.exe
          body: |
            ## StreamGet v2.0

            ### Windows
            - **StreamGet_Setup.exe** — Installer (Start Menu + Desktop shortcut)
            - **VideoDownloader.exe** — Portable (no install needed)

            ### Linux
            - **StreamGet_Linux.deb** — Debian/Ubuntu package
          token: ${{ secrets.GITHUB_TOKEN }}



  #  LINUX — Binary + .deb package (App Menu shortcut)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --onefile --noconsole --name "VideoDownloader" \
            --add-data "logo.png:." \
            downloader.py

      - name: Create .deb package
        run: |
          mkdir -p deb_pkg/usr/local/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb_pkg/DEBIAN

          # Binary
          cp dist/VideoDownloader deb_pkg/usr/local/bin/VideoDownloader
          chmod +x deb_pkg/usr/local/bin/VideoDownloader

          # Icon
          cp logo.png deb_pkg/usr/share/icons/hicolor/256x256/apps/streamget.png

          # .desktop file — App Menu entry
          cat > deb_pkg/usr/share/applications/streamget.desktop << 'EOF'
          [Desktop Entry]
          Version=2.0
          Name=StreamGet
          Comment=Video Downloader — YouTube, playlists and more
          Exec=/usr/local/bin/VideoDownloader
          Icon=streamget
          Terminal=false
          Type=Application
          Categories=Network;Video;
          Keywords=youtube;download;video;playlist;
          StartupWMClass=VideoDownloader
          EOF

          # DEBIAN control
          cat > deb_pkg/DEBIAN/control << 'EOF'
          Package: streamget
          Version: 2.0
          Architecture: amd64
          Maintainer: Md. Imran Ali <imran.28279@gmail.com>
          Depends: ffmpeg, python3-tk
          Description: StreamGet Video Downloader
           Download videos and playlists from YouTube and other sites.
           Supports quality selection, pause/resume, and playlist ranges.
          EOF

          # postinst — install করার পর icon cache update করে
          cat > deb_pkg/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications || true
          fi
          EOF
          chmod 755 deb_pkg/DEBIAN/postinst

          # postrm — updates cache after uninstall
          cat > deb_pkg/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications || true
          fi
          EOF
          chmod 755 deb_pkg/DEBIAN/postrm

          dpkg-deb --build deb_pkg StreamGet_Linux.deb

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamGet-Linux
          path: StreamGet_Linux.deb

      - name: Add .deb to Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "latest"
          name: "Latest Build"
          files: StreamGet_Linux.deb
          token: ${{ secrets.GITHUB_TOKEN }}
